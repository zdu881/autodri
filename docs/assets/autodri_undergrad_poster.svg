<svg width="1400" height="2000" viewBox="0 0 1400 2000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="top" x1="0" y1="0" x2="1400" y2="620" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#123047"/>
      <stop offset="0.55" stop-color="#1E5B64"/>
      <stop offset="1" stop-color="#F2A65A"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FBFC"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#10202E" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M0 0L14 7L0 14V0Z" fill="#36515F"/>
    </marker>
    <style>
      .font { font-family: 'Noto Sans CJK SC', 'Microsoft YaHei', 'PingFang SC', Arial, sans-serif; }
      .title { font: 800 58px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #FFFFFF; }
      .subtitle { font: 500 26px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #EAF6F5; }
      .meta { font: 500 22px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #173247; }
      .section { font: 800 30px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #173247; }
      .body { font: 500 22px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #274553; }
      .small { font: 500 18px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #486370; }
      .tiny { font: 700 16px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #274553; }
      .label { font: 800 19px 'Noto Sans CJK SC', 'Microsoft YaHei', Arial, sans-serif; fill: #173247; }
      .white { fill: #FFFFFF; }
    </style>
  </defs>

  <rect width="1400" height="2000" fill="#EEF5F4"/>
  <rect x="0" y="0" width="1400" height="380" fill="url(#top)"/>

  <text x="80" y="96" class="title">面向自然驾驶视频的驾驶员注视</text>
  <text x="80" y="168" class="title">与行为监测分析系统</text>
  <text x="82" y="222" class="subtitle">本科生科研计划项目总结 | Driver Gaze &amp; Behavior Monitoring Workflow</text>

  <rect x="80" y="258" width="520" height="58" rx="14" fill="#FFFFFF" fill-opacity="0.92"/>
  <text x="108" y="296" class="meta">关键词：自然驾驶 · few-shot 适配 · ROI 复核 · 窗口级统计</text>

  <g transform="translate(960 56)">
    <rect x="0" y="0" width="320" height="210" rx="28" fill="#0E2533" stroke="#B5E2E0" stroke-width="3"/>
    <rect x="34" y="38" width="252" height="116" rx="18" fill="#1C5260"/>
    <path d="M72 170C92 112 132 86 176 89C222 92 252 123 266 171" stroke="#EAF6F5" stroke-width="12" stroke-linecap="round"/>
    <circle cx="172" cy="78" r="34" fill="#F3C9A6"/>
    <path d="M136 82C156 104 192 104 212 82" stroke="#173247" stroke-width="5" stroke-linecap="round"/>
    <path d="M56 142C108 114 200 108 276 132" stroke="#F2A65A" stroke-width="8" stroke-linecap="round"/>
    <path d="M166 78L244 40" stroke="#B5E2E0" stroke-width="5" stroke-linecap="round"/>
    <circle cx="244" cy="40" r="8" fill="#B5E2E0"/>
  </g>

  <rect x="70" y="430" width="1260" height="230" rx="26" fill="url(#panel)" stroke="#C9DADC" filter="url(#shadow)"/>
  <text x="106" y="486" class="section">项目背景与目标</text>
  <text x="106" y="532" class="body">真实车内视频存在光照变化、驾驶员差异、车辆布局差异、遮挡和无效帧等问题。</text>
  <text x="106" y="570" class="body">项目目标是构建一套可复核、可扩展的驾驶员注视与行为分析流程，服务自然驾驶研究。</text>
  <text x="106" y="608" class="body">核心输出包括帧级注视状态、手握方向盘状态，以及可用于行为分析的时间窗口统计指标。</text>

  <rect x="70" y="710" width="600" height="420" rx="26" fill="url(#panel)" stroke="#C9DADC" filter="url(#shadow)"/>
  <text x="106" y="766" class="section">任务定义</text>
  <text x="106" y="814" class="body">注视状态标签体系：</text>
  <g transform="translate(106 846)">
    <rect x="0" y="0" width="210" height="54" rx="14" fill="#DDEFD8"/>
    <text x="24" y="35" class="label">Forward</text>
    <rect x="236" y="0" width="240" height="54" rx="14" fill="#DCEAF3"/>
    <text x="260" y="35" class="label">Non-Forward</text>
    <rect x="0" y="78" width="210" height="54" rx="14" fill="#F8E5B8"/>
    <text x="24" y="113" class="label">In-Car</text>
    <rect x="236" y="78" width="240" height="54" rx="14" fill="#F4C6BE"/>
    <text x="260" y="113" class="label">Other</text>
  </g>
  <text x="106" y="1018" class="body">其中 Other 用于吸收 ROI 错误、无人脸、非目标驾驶员、无法判断等无效样本。</text>
  <text x="106" y="1056" class="body">这使系统更适合真实自然驾驶视频，而不是只适合干净的分类数据集。</text>

  <rect x="730" y="710" width="600" height="420" rx="26" fill="url(#panel)" stroke="#C9DADC" filter="url(#shadow)"/>
  <text x="766" y="766" class="section">技术路线</text>
  <g transform="translate(766 812)">
    <rect x="0" y="0" width="212" height="62" rx="15" fill="#E2F0F0" stroke="#93BFC0"/>
    <text x="34" y="39" class="tiny">目标视频 / 片段</text>
    <path d="M224 31H286" stroke="#36515F" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="300" y="0" width="212" height="62" rx="15" fill="#FFF0D8" stroke="#D7A660"/>
    <text x="350" y="39" class="tiny">ROI 定位复核</text>

    <path d="M406 74V118" stroke="#36515F" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="300" y="132" width="212" height="62" rx="15" fill="#F6DAD5" stroke="#D89184"/>
    <text x="356" y="171" class="tiny">人工标注</text>
    <path d="M288 163H226" stroke="#36515F" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="0" y="132" width="212" height="62" rx="15" fill="#DDEFD8" stroke="#9BC48F"/>
    <text x="42" y="171" class="tiny">few-shot 训练</text>

    <path d="M106 206V250" stroke="#36515F" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="0" y="264" width="212" height="62" rx="15" fill="#DCEAF3" stroke="#94B5CC"/>
    <text x="42" y="303" class="tiny">片段级推理</text>
    <path d="M224 295H286" stroke="#36515F" stroke-width="4" marker-end="url(#arrow)"/>
    <rect x="300" y="264" width="212" height="62" rx="15" fill="#EEF0F3" stroke="#A8B1BA"/>
    <text x="338" y="303" class="tiny">窗口级统计</text>
  </g>

  <rect x="70" y="1180" width="1260" height="310" rx="26" fill="url(#panel)" stroke="#C9DADC" filter="url(#shadow)"/>
  <text x="106" y="1236" class="section">阶段性成果</text>
  <g transform="translate(106 1278)">
    <circle cx="10" cy="12" r="8" fill="#1E5B64"/>
    <text x="34" y="20" class="body">整理形成可安装 Python 包 autodri，提供稳定 CLI 和外部 workspace 数据管理方式。</text>
    <circle cx="10" cy="58" r="8" fill="#1E5B64"/>
    <text x="34" y="66" class="body">实现注视识别、手握方向盘检测、ROI 分配、标注、few-shot 训练和批量推理流程。</text>
    <circle cx="10" cy="104" r="8" fill="#1E5B64"/>
    <text x="34" y="112" class="body">将帧级模型输出聚合为 off-path 比例、glance rate、wheel ratio 等行为级指标。</text>
    <circle cx="10" cy="150" r="8" fill="#1E5B64"/>
    <text x="34" y="158" class="body">沉淀标注说明、支持工作流、跨域评估计划、PERCLOS 指标说明和论文方法草稿。</text>
  </g>

  <rect x="70" y="1540" width="600" height="300" rx="26" fill="url(#panel)" stroke="#C9DADC" filter="url(#shadow)"/>
  <text x="106" y="1596" class="section">创新点</text>
  <text x="106" y="1644" class="body">1. 将 ROI 错误与无效帧显式纳入流程。</text>
  <text x="106" y="1682" class="body">2. 通过 participant-specific few-shot 降低新域标注成本。</text>
  <text x="106" y="1720" class="body">3. 使用 Other 类提升部署鲁棒性。</text>
  <text x="106" y="1758" class="body">4. 从分类结果走向行为级统计输出。</text>

  <rect x="730" y="1540" width="600" height="300" rx="26" fill="url(#panel)" stroke="#C9DADC" filter="url(#shadow)"/>
  <text x="766" y="1596" class="section">后续计划</text>
  <text x="766" y="1644" class="body">1. 补充跨驾驶员、跨车辆、跨光照评估。</text>
  <text x="766" y="1682" class="body">2. 完成 Accuracy vs. Labeled Samples 曲线。</text>
  <text x="766" y="1720" class="body">3. 增强 Other 和长尾场景样本覆盖。</text>
  <text x="766" y="1758" class="body">4. 训练轻量化 hand-on-wheel student detector。</text>

  <rect x="70" y="1880" width="1260" height="70" rx="18" fill="#173247"/>
  <text x="106" y="1925" class="subtitle">结论：本项目构建了面向真实自然驾驶研究的可复现驾驶员状态分析工作流，重点价值在于数据质量控制、新域快速适配和可解释行为统计。</text>
</svg>
