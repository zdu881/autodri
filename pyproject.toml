[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "autodri"
version = "0.1.0"
description = "Autodri code-first package with external workspace support."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pillow>=10.0",
    "pytest>=8.0",
    "tomli>=2.0; python_version < '3.11'",
]
experiments = [
    "numpy>=1.24",
    "onnx>=1.15",
    "onnxruntime>=1.16",
    "pillow>=10.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "timm>=0.9",
    "torch>=2.0",
    "torchvision>=0.15",
    "ultralytics>=8.0",
]

[project.urls]
Repository = "https://github.com/zdu881/autodri"
Documentation = "https://github.com/zdu881/autodri/tree/main/docs"
Paper = "https://github.com/zdu881/autodri/blob/main/paper/autoui.pdf"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
